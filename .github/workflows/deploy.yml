name: Deploy to GitHub Pages

# Every push to main checks, builds, and publishes build/ to the gh-pages branch.
# GitHub Pages serves that branch at https://app-hub.yjaphzs.xyz (public/CNAME).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# The deploy step pushes to gh-pages with GITHUB_TOKEN, so it needs write access.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: app-hub.yjaphzs.xyz
